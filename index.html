<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vorthyx | Minecraft</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;

  background:
    linear-gradient(rgba(20,5,35,.82), rgba(10,2,20,.94)),
    repeating-linear-gradient(
      0deg,
      #24102f 0 24px,
      #2d1439 24px 48px
    );

  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px;
}

.site {
  width: min(720px, 100%);
  text-align: center;

  background: rgba(31,9,45,.95);

  border: 3px solid #9b4dff;

  box-shadow:
    0 0 30px rgba(155,77,255,.45),
    8px 8px 0 #12051a;

  padding: 34px 24px;
}

h1 {
  margin: 0 0 8px;

  font-size: clamp(44px, 12vw, 86px);

  letter-spacing: 5px;

  color: #c77dff;

  text-shadow:
    5px 5px 0 #4c197d,
    0 0 18px #a855f7;

  font-weight: 900;
}

.subtitle {
  margin: 0 0 28px;

  color: #e9d5ff;

  font-size: 16px;
}

.links {
  display: grid;
  gap: 12px;
}

a {
  display: block;

  padding: 16px;

  background: #6d28a8;

  color: white;

  text-decoration: none;

  border: 3px solid #b86cff;

  box-shadow: 5px 5px 0 #2d0b42;

  font-weight: 800;

  text-transform: uppercase;

  letter-spacing: 1px;

  transition: .12s;
}

a:hover {
  background: #8b35d1;

  transform: translate(-2px,-2px);
}

.grass {
  margin: 28px -24px -34px;

  height: 22px;

  background: #7d3fc7;

  border-top: 6px solid #b779ff;
}
</style>
</head>

<body>

<main class="site">

<h1>VORTHYX</h1>

<p class="subtitle">
Seu portal de texturas para Minecraft Bedrock
</p>

<div class="links">

<a href="https://www.curseforge.com/minecraft-bedrock/texture-packs/f8thful-bedrock" target="_blank">
F8thful 8x8
</a>

<a href="https://www.curseforge.com/minecraft-bedrock/addons/faithful-32x-bedrock" target="_blank">
Faithful 32x
</a>

<a href="https://www.curseforge.com/minecraft-bedrock/addons/faithful-64x-bedrock" target="_blank">
Faithful 64x
</a>

<a href="https://www.curseforge.com/minecraft-bedrock/texture-packs/bare-bones-be" target="_blank">
Bare Bones
</a>

<a href="https://www.curseforge.com/minecraft-bedrock/texture-packs/faithful-nature" target="_blank">
Faithful Nature
</a>

</div>

<div class="grass"></div>

</main>

</body>
</html>
